<!-- @dsCard group="Platform" viewport="1440x900" name="SADA 3D platform" subtitle="Home → marketplace → product → configurator → checkout → tracking" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>SADA 3D — Platform UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<style>html,body{height:100%}body{background:var(--surface-page)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
</head><body><div id="root"></div>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="MarketplaceScreen.jsx"></script>
<script type="text/babel" src="ProductScreen.jsx"></script>
<script type="text/babel" src="ConfiguratorScreen.jsx"></script>
<script type="text/babel" src="CheckoutScreen.jsx"></script>
<script type="text/babel" src="TrackingScreen.jsx"></script>
<script type="text/babel">
function App(){
  const [view,setView]=React.useState('Home');
  const [product,setProduct]=React.useState(null);
  const [cart,setCart]=React.useState([]);
  const nav=(t)=>{ if(t==='Cart'){setView('Checkout');return;} if(t==='Account'){setView('Tracking');return;} setView(t); window.scrollTo(0,0); };
  const open=(p)=>{ setProduct(p); setView('Product'); window.scrollTo(0,0); };
  const add=(p,q)=>setCart(c=>[...c,{name:p.name,spec:p.material+' / '+p.color,qty:q,price:p.price}]);
  let screen;
  if(view==='Product') screen=<ProductScreen product={product} onAddToCart={add} onOpenProduct={open}/>;
  else if(view==='Shop'||view==='Solutions') screen=<MarketplaceScreen onOpenProduct={open}/>;
  else if(view==='Custom Print') screen=<ConfiguratorScreen onCheckout={()=>setView('Checkout')}/>;
  else if(view==='Checkout') screen=<CheckoutScreen cart={cart} onComplete={()=>setView('Tracking')}/>;
  else if(view==='Tracking') screen=<TrackingScreen/>;
  else if(view==='Materials'||view==='How It Works'||view==='Home') screen=<HomeScreen onNavigate={nav} onOpenProduct={open}/>;
  else screen=<HomeScreen onNavigate={nav} onOpenProduct={open}/>;
  const active=['Shop','Custom Print','Materials','Solutions','How It Works'].includes(view)?view:'';
  return <Shell view={active} onNavigate={nav} cartCount={cart.length}>{screen}</Shell>;
}
setTimeout(()=>ReactDOM.createRoot(document.getElementById('root')).render(<App/>),0);
</script>
</body></html>
