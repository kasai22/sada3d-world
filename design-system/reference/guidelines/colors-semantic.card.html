<!-- @dsCard group="Colors" viewport="700x170" name="Semantic surfaces & text" subtitle="What to reach for instead of raw values" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--void);font:var(--type-body);color:var(--text-primary)}.pad{padding:24px}</style></head><body><div class="pad" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;font:var(--type-technical-sm)">
<div style="background:var(--surface-page);border:1px solid var(--border-default);padding:12px"><div style="color:var(--text-primary)">Page</div><div style="color:var(--text-disabled);margin-top:4px">--surface-page</div></div><div style="background:var(--surface-panel);border:1px solid var(--border-default);padding:12px"><div style="color:var(--text-primary)">Panel</div><div style="color:var(--text-disabled);margin-top:4px">--surface-panel</div></div><div style="background:var(--surface-card);border:1px solid var(--border-default);padding:12px"><div style="color:var(--text-primary)">Card</div><div style="color:var(--text-disabled);margin-top:4px">--surface-card</div></div><div style="background:var(--surface-raised);border:1px solid var(--border-default);padding:12px"><div style="color:var(--text-primary)">Raised</div><div style="color:var(--text-disabled);margin-top:4px">--surface-raised</div></div>
<div style="padding:12px;border:1px solid var(--border-subtle)"><div style="color:var(--text-primary)">Primary information</div><div style="color:var(--text-disabled);margin-top:4px">--text-primary</div></div><div style="padding:12px;border:1px solid var(--border-subtle)"><div style="color:var(--text-secondary)">Secondary information</div><div style="color:var(--text-disabled);margin-top:4px">--text-secondary</div></div><div style="padding:12px;border:1px solid var(--border-subtle)"><div style="color:var(--text-muted)">Muted information</div><div style="color:var(--text-disabled);margin-top:4px">--text-muted</div></div><div style="padding:12px;border:1px solid var(--border-subtle)"><div style="color:var(--text-accent)">Accent information</div><div style="color:var(--text-disabled);margin-top:4px">--text-accent</div></div>
</div></body></html>
