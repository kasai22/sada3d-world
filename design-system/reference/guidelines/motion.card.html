<!-- @dsCard group="Brand" viewport="700x160" name="Motion" subtitle="Durations and easing — precision, never bounce" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--void);font:var(--type-body);color:var(--text-primary)}.pad{padding:24px}</style></head><body><div class="pad" style="font:var(--type-technical-sm);color:var(--text-secondary);display:grid;grid-template-columns:repeat(2,1fr);gap:10px 32px;text-transform:uppercase">
<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border-subtle);padding-bottom:6px"><span style="color:var(--text-muted)">motion.instant</span><span>80 ms</span></div><div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border-subtle);padding-bottom:6px"><span style="color:var(--text-muted)">motion.fast</span><span>140 ms</span></div><div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border-subtle);padding-bottom:6px"><span style="color:var(--text-muted)">motion.medium</span><span>260 ms</span></div><div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border-subtle);padding-bottom:6px"><span style="color:var(--text-muted)">motion.slow</span><span>480 ms</span></div><div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border-subtle);padding-bottom:6px"><span style="color:var(--text-muted)">ease.standard</span><span>cubic-bezier(.2,0,0,1)</span></div><div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border-subtle);padding-bottom:6px"><span style="color:var(--text-muted)">ease.out</span><span>cubic-bezier(.16,1,.3,1)</span></div><div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border-subtle);padding-bottom:6px"><span style="color:var(--text-muted)">ease.mechanical</span><span>cubic-bezier(.65,0,.35,1)</span></div><div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border-subtle);padding-bottom:6px"><span style="color:var(--text-muted)">reduced motion</span><span>all durations → 0</span></div>
</div></body></html>
